name: Windows Package

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "electron/**"
      - "src/**"
      - "engine/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/windows-package.yml"

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create engine venv
        shell: pwsh
        run: |
          python -m venv engine/.venv
          engine/.venv/Scripts/python -m pip install --upgrade pip

      - name: Install npm dependencies
        run: npm ci

      - name: Build unpacked app (includes sidecar build)
        shell: pwsh
        run: |
          npm run dist:dir

      - name: Upload win-unpacked
        uses: actions/upload-artifact@v4
        with:
          name: win-unpacked
          path: release/win-unpacked/**
          if-no-files-found: error

      - name: Upload sidecar exe
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-exe
          path: engine/dist/sidecar/sidecar.exe
          if-no-files-found: error

