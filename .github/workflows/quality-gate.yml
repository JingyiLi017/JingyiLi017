name: Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "master"]
    paths:
      - "engine/**"
      - "scripts/**"
      - "src/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/quality-gate.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "engine/**"
      - "scripts/**"
      - "src/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/quality-gate.yml"

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-quality:
    runs-on: windows-latest
    timeout-minutes: 70
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            engine/requirements.txt
            engine/requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Python venv
        shell: pwsh
        run: |
          python -m venv engine/.venv
          engine/.venv/Scripts/python -m pip install --upgrade pip
          engine/.venv/Scripts/python -m pip install -r engine/requirements.txt
          engine/.venv/Scripts/python -m pip install -r engine/requirements-dev.txt

      - name: Start PostgreSQL (Docker)
        shell: pwsh
        run: |
          docker compose -f .\infra\docker-compose.yml up -d postgres
          docker compose -f .\infra\docker-compose.yml ps

      - name: Start engine
        shell: pwsh
        run: |
          $logDir = Join-Path $PWD "docs\reports\ci"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $outLog = Join-Path $logDir "engine.out.log"
          $errLog = Join-Path $logDir "engine.err.log"
          $proc = Start-Process -FilePath ".\engine\.venv\Scripts\python.exe" `
            -ArgumentList "-m","uvicorn","app.main:app","--host","127.0.0.1","--port","17777" `
            -WorkingDirectory ".\engine" `
            -PassThru `
            -RedirectStandardOutput $outLog `
            -RedirectStandardError $errLog
          "ENGINE_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "engine pid: $($proc.Id)"

      - name: Wait for engine health
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 0; $i -lt 50; $i++) {
            try {
              $resp = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:17777/v1/health" -TimeoutSec 3
              if ($resp.StatusCode -eq 200) {
                $ok = $true
                Write-Host "health ready"
                break
              }
            } catch {}
            Start-Sleep -Milliseconds 800
          }
          if (-not $ok) {
            throw "engine health check timeout"
          }

      - name: Run quality gate
        shell: pwsh
        run: |
          cmd /c npm run verify:quality

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-reports
          path: |
            docs/reports/**
            mvp_diagnose/desktop_smart_pipeline_result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop services
        if: always()
        shell: pwsh
        run: |
          if ($env:ENGINE_PID) {
            try {
              Stop-Process -Id ([int]$env:ENGINE_PID) -Force
            } catch {}
          }
          docker compose -f .\infra\docker-compose.yml down
