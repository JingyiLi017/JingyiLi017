services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: writerbook_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: novel_db
    ports:
      - "5432:5432"
    volumes:
      - writerbook_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d novel_db"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  writerbook_pgdata:

